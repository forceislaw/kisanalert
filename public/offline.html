<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — KisanAlert</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #F7F5F0;
      color: #1C1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B6258;
      max-width: 24rem;
      line-height: 1.6;
    }
    .retry {
      margin-top: 1.5rem;
      padding: 0.625rem 1.5rem;
      background: #1C1917;
      color: #F7F5F0;
      border: none;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .retry:hover { background: #2C2927; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="20" fill="#E07A5F"/>
    <path d="M20 28C11 24 13 12 20 8C27 12 29 24 20 28Z" fill="#F7F5F0"/>
  </svg>
  <h1>You&rsquo;re offline</h1>
  <p>KisanAlert needs an internet connection to load pest data and AI analysis. Check your connection and try again.</p>
  <button class="retry" onclick="location.reload()">Retry</button>
</body>
</html>
